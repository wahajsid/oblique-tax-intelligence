services:
  - type: web
    name: oblique-tax-intelligence
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: SITE_INDEXABLE
        value: "false"
