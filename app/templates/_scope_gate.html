{# Scope confirmation (V4 pattern). Unconfirmed = figure shown greyed with a review banner. #}
<fieldset class="scope-box">
  <legend>Does this fit you?</legend>
  <div class="field"><label>Any special regime, exemption or relief not covered above?</label>
    <select name="special_regime"><option value="unknown" selected>I am not sure</option><option value="yes">Yes</option><option value="no">No, my facts fit the ordinary scope</option></select></div>
  <label class="check"><input type="checkbox" name="scope_confirmed"> My facts fit this calculator.</label>
  <p class="small muted">Until then the result is marked review required.</p>
</fieldset>
