{# Scope confirmation (V4 pattern). Unconfirmed = figure shown greyed with a review banner. #}
<fieldset class="scope-box">
  <legend>{{ t("Does this fit you?") }}</legend>
  <div class="field"><label>{{ t("Any special regime, exemption or relief not covered above?") }}</label>
    <select name="special_regime"><option value="unknown" selected>{{ t("I am not sure") }}</option><option value="yes">{{ t("Yes") }}</option><option value="no">{{ t("No, my facts fit the ordinary scope") }}</option></select></div>
  <label class="check"><input type="checkbox" name="scope_confirmed"> {{ t("My facts fit this calculator.") }}</label>
  <p class="small muted">{{ t("Until then the result is marked review required.") }}</p>
</fieldset>
