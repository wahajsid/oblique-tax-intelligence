{# Scope confirmation (V4 pattern). Unconfirmed = figure shown greyed with a review banner. #}
<fieldset class="scope-box">
  <legend>Scope check</legend>
  <div class="field"><label>Does a special regime, exemption or relief apply that is not listed in this form?</label>
    <select name="special_regime"><option value="unknown" selected>I am not sure</option><option value="yes">Yes</option><option value="no">No, my facts fit the ordinary scope</option></select></div>
  <label class="check"><input type="checkbox" name="scope_confirmed"> I have read the assumptions and my inputs fit this calculator's scope.</label>
  <p class="small muted">Until both are answered the result is shown as "review required".</p>
</fieldset>
